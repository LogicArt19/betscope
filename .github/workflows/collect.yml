name: Collecte des données
on:
  schedule:
    - cron: "17 * * * *"   # toutes les heures (les cotes ne sont rafraîchies que quand c'est dû)
  workflow_dispatch:
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CONFIGURED: ${{ secrets.CF_API_TOKEN != '' && secrets.ODDS_KEY != '' }}
    steps:
      - name: Secrets présents ?
        if: env.CONFIGURED != 'true'
        run: echo "::notice::Secrets Cloudflare / The Odds API pas encore ajoutés, collecte ignorée."
      - uses: actions/checkout@v4
        if: env.CONFIGURED == 'true'
      - uses: actions/setup-python@v5
        if: env.CONFIGURED == 'true'
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        if: env.CONFIGURED == 'true'
        with:
          path: .collect_cache
          key: collect-${{ github.run_id }}
          restore-keys: collect-
      - name: Espace de stockage
        if: env.CONFIGURED == 'true'
        id: kv
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || '248f03341b6e3ba1b8392e98d98f9844' }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: echo "id=$(python ci/kv_id.py)" >> "$GITHUB_OUTPUT"
      - name: Collecte
        if: env.CONFIGURED == 'true'
        env:
          ODDS_KEY: ${{ secrets.ODDS_KEY }}
          FD_KEY: ${{ secrets.FD_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || '248f03341b6e3ba1b8392e98d98f9844' }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_ID: ${{ steps.kv.outputs.id }}
        run: python collector.py
