name: Collecte des données
on:
  schedule:
    - cron: "17 * * * *"   # toutes les heures (les cotes ne sont rafraîchies que quand c'est dû)
  workflow_dispatch:
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CONFIGURED: ${{ secrets.CF_API_TOKEN != '' && secrets.ODDS_KEY != '' }}
    steps:
      - name: Secrets présents ?
        if: env.CONFIGURED != 'true'
        run: echo "::notice::Secrets Cloudflare / The Odds API pas encore ajoutés, collecte ignorée."
      - uses: actions/checkout@v4
        if: env.CONFIGURED == 'true'
      - uses: actions/setup-python@v5
        if: env.CONFIGURED == 'true'
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        if: env.CONFIGURED == 'true'
        with:
          path: .collect_cache
          key: collect-${{ github.run_id }}
          restore-keys: collect-
      - name: Espace de stockage
        if: env.CONFIGURED == 'true'
        id: kv
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || '248f03341b6e3ba1b8392e98d98f9844' }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          id=$(python ci/kv_id.py)
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Collecte
        if: env.CONFIGURED == 'true'
        env:
          ODDS_KEY: ${{ secrets.ODDS_KEY }}
          FD_KEY: ${{ secrets.FD_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || '248f03341b6e3ba1b8392e98d98f9844' }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_ID: ${{ steps.kv.outputs.id }}
        run: python collector.py
      - name: Registre public certifié (dépôt GitHub du site)
        if: env.CONFIGURED == 'true' && hashFiles('public_ledger.json') != ''
        env:
          TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::notice::PUBLISH_TOKEN absent : registre non publié"; exit 0; fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/LogicArt19/cotescope.git" site
          mkdir -p site/bilan
          cp public_ledger.json site/bilan/registre.json
          cd site
          git config user.name "Cotescope (registre automatique)"
          git config user.email "registre@cotescope.fr"
          git add bilan/registre.json
          if git diff --cached --quiet; then echo "registre inchangé"; exit 0; fi
          git commit -m "Registre : mise à jour automatique $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push && break; git pull --rebase; done
