name: Déploiement du serveur
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CONFIGURED: ${{ secrets.CF_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.CONFIGURED == 'true'
      - uses: actions/setup-node@v4
        if: env.CONFIGURED == 'true'
        with:
          node-version: "22"
      - name: Espace de stockage
        if: env.CONFIGURED == 'true'
        id: kv
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || '248f03341b6e3ba1b8392e98d98f9844' }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          id=$(python3 ci/kv_id.py)
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Adresse workers.dev
        if: env.CONFIGURED == 'true'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || '248f03341b6e3ba1b8392e98d98f9844' }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 ci/cf_subdomain.py
      - name: Déploiement
        if: env.CONFIGURED == 'true'
        id: dep
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || '248f03341b6e3ba1b8392e98d98f9844' }}
          S_WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
          S_WHOP_COMPANY_ID: ${{ secrets.WHOP_COMPANY_ID }}
          S_PLAN_IDS: ${{ secrets.PLAN_IDS }}
          S_OWNER_EMAILS: ${{ secrets.OWNER_EMAILS }}
          S_WHOP_WEBHOOK_SECRET: ${{ secrets.WHOP_WEBHOOK_SECRET }}
          S_RESEND_KEY: ${{ secrets.RESEND_KEY }}
          S_MAIL_FROM: ${{ secrets.MAIL_FROM }}
          S_MAIL_RELAY_URL: ${{ secrets.MAIL_RELAY_URL }}
          S_MAIL_RELAY_KEY: ${{ secrets.MAIL_RELAY_KEY }}
          S_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          S_TELEGRAM_BOT_NAME: ${{ secrets.TELEGRAM_BOT_NAME }}
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf %s "$CLOUDFLARE_API_TOKEN" | tr -d "[:space:]")"
          sed -i "s/__KV_ID__/${{ steps.kv.outputs.id }}/" wrangler.toml
          npx --yes wrangler@3.114.0 deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          for n in WHOP_API_KEY OWNER_EMAILS WHOP_WEBHOOK_SECRET RESEND_KEY MAIL_FROM MAIL_RELAY_URL MAIL_RELAY_KEY TELEGRAM_BOT_TOKEN TELEGRAM_BOT_NAME; do
            v="$(printenv "S_$n" || true)"
            if [ -n "$v" ]; then printf '%s' "$v" | npx --yes wrangler@3.114.0 secret put "$n" >/dev/null && echo "secret $n OK"; fi
          done
          # clé de signature des sessions : créée une seule fois
          if ! npx --yes wrangler@3.114.0 secret list 2>/dev/null | grep -q SESSION_SECRET; then
            openssl rand -hex 32 | tr -d '\n' | npx --yes wrangler@3.114.0 secret put SESSION_SECRET >/dev/null && echo "secret SESSION_SECRET créé"
          fi
      - name: Bot Telegram (vérification + webhook)
        if: env.CONFIGURED == 'true' && steps.dep.outputs.url != ''
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_NAME: ${{ secrets.TELEGRAM_BOT_NAME }}
        run: |
          if [ -z "$TG" ]; then echo "::notice::TELEGRAM_BOT_TOKEN absent : alertes Telegram désactivées"; exit 0; fi
          TG="$(printf %s "$TG" | tr -d '[:space:]')"
          me=$(curl -s "https://api.telegram.org/bot${TG}/getMe")
          if echo "$me" | grep -q '"ok":true'; then
            user=$(echo "$me" | python3 -c "import sys,json; print(json.load(sys.stdin)['result']['username'])")
            echo "Jeton Telegram valide : bot @$user"
            name="$(printf %s "$TG_NAME" | tr -d '[:space:]@')"
            if [ -n "$name" ] && [ "${name,,}" != "${user,,}" ]; then echo "::warning::TELEGRAM_BOT_NAME ($name) ne correspond pas au bot du jeton (@$user)"; fi
          else
            echo "::error::Le jeton Telegram est refusé par Telegram : vérifie le secret TELEGRAM_BOT_TOKEN"; exit 0
          fi
          sec=$(printf %s "$TG" | sha256sum | cut -c1-48)
          curl -s "https://api.telegram.org/bot${TG}/setWebhook" -d "url=${{ steps.dep.outputs.url }}/api/telegram/webhook" -d "secret_token=${sec}" -d 'allowed_updates=["message"]' | grep -o '"ok":[a-z]*'
      - name: Adresse du serveur publiée sur le site (config.json)
        if: env.CONFIGURED == 'true' && steps.dep.outputs.url != ''
        env:
          TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/LogicArt19/cotescope.git" site
          cd site
          python3 - <<PY
          import json
          try:
              c = json.load(open("config.json"))
          except Exception:
              c = {}
          c["api"] = "${{ steps.dep.outputs.url }}"
          json.dump(c, open("config.json", "w"), indent=2)
          PY
          git config user.name "Cotescope bot"
          git config user.email "actions@users.noreply.github.com"
          git add config.json
          git commit -m "Adresse du serveur" || echo "inchangé"
          git push
      - name: Lancer la collecte et la publication du logiciel
        if: env.CONFIGURED == 'true' && steps.dep.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run collect.yml --repo "$GITHUB_REPOSITORY" || true
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" || true
