name = "cotescope-api"
main = "worker.js"
compatibility_date = "2026-06-01"
workers_dev = true

[[kv_namespaces]]
binding = "KV"
id = "__KV_ID__"

# forfaits Whop (identifiants publics, pas secrets)
[vars]
WHOP_COMPANY_ID = "biz_imzLiN4lnuxNJc"
PLAN_IDS = '{"essentiel":"plan_VZOeTCDp6mseX","pro":"plan_xNSa2mwssfxvH","elite":"plan_PSEfzCI46Vyz9"}'

# compos officielles : vérification chaque minute (seulement les matchs qui commencent dans l heure)
[triggers]
crons = ["* * * * *"]

# votes du public (stockage SQLite d'un Durable Object, inclus dans l'offre gratuite)
[[durable_objects.bindings]]
name = "VOTES"
class_name = "Votes"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Votes"]
